# Somente desenvolvimento local: H2 em memoria, resetado ao encerrar o processo.
spring.datasource.url=jdbc:h2:mem:extensaodev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
app.security.secure-cookies=false
server.servlet.session.cookie.secure=false
