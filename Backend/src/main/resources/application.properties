# API: nenhum dado ficticio de login por padrao.
server.port=${PORT:3001}

# Produção exige banco configurado. Rode com -Dspring-boot.run.profiles=dev para usar H2 local.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Conservador para planos gratuitos de PostgreSQL.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m

server.servlet.session.cookie.name=EXTENSAO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SECURE_COOKIES:true}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

app.security.secure-cookies=${APP_SECURE_COOKIES:true}
app.bootstrap.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.name=${APP_BOOTSTRAP_ADMIN_NAME:Direcao}

server.error.include-message=never
server.error.include-stacktrace=never
