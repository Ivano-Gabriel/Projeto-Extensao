# porta 3001: o front (Vite) repassa /api para cá
server.port=3001

# banco H2 em arquivo (cria a pasta dados/ dentro de Backend)
spring.datasource.url=jdbc:h2:file:./dados/alunos
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
