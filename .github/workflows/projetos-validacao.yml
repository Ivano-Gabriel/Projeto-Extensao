name: Validar apps e backend
on:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/biblioteca/**'
      - 'Backend/**'
      - '.github/workflows/projetos-validacao.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/biblioteca/**'
      - 'Backend/**'
      - '.github/workflows/projetos-validacao.yml'
permissions:
  contents: read
jobs:
  frontends:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, biblioteca]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - run: mvn -B -ntp test
