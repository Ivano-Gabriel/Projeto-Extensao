name: Validar prototipo Estudos
on:
  push:
    paths:
      - 'apps/estudos/**'
      - '.github/workflows/estudos-validacao.yml'
  pull_request:
    paths:
      - 'apps/estudos/**'
      - '.github/workflows/estudos-validacao.yml'
permissions:
  contents: read
jobs:
  estudos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/estudos
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/estudos/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Rodar testes
        run: npm test
      - name: Compilar
        run: npm run build
